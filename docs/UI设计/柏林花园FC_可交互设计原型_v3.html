const counts=()=>`<div class="counts"><span class="yes">参加 <b>8 / 22</b></span><span class="maybe">待定 3</span><span class="no">请假 2</span></div>`;
function metrics(items,cls=''){return `<div class="metrics ${cls}">${items.map(([v,l,c=''])=>`<div class="metric ${cls}"><strong class="${c}">${v}</strong><span>${l}</span></div>`).join('')}</div>`;}
const venue='花园运动公园 · 1号场';
function teams(score='VS'){return `<div class="match-teams"><div class="match-team">${badge('match-crest')}<span class="team-name">柏林花园 FC</span></div><div class="match-score">${score}<small>主场</small></div><div class="match-team"><span class="opponent-badge">${icon('shield',30)}</span><span class="team-name">绿茵联队</span></div></div>`;}
function nextMatch(){return `<div class="card match-feature match-feature-premium"><div class="match-context"><span class="matchday-label">NEXT MATCH / 下一场</span><span class="match-format">11 人制</span></div><div class="fixture-eyebrow">周末友谊赛</div>${teams()}<div class="match-time-big">11月22日 <span>周日 · 19:30</span></div><div class="meta-line">${icon('pin',16)}<span>${venue}</span></div><div class="feature-signups"><span><b>8</b> / 22 人参加</span><span>3 待定 · 2 请假</span></div>${go('查看比赛 · 去报名 '+icon('arrow',17),'match-detail','primary feature-cta')}<div class="feature-response">我的回应：${demo.reply?{yes:'参加',maybe:'待定',no:'请假'}[demo.reply]:'未回应'}</div></div>`;}
function menu(text,key,ic='file',detail=''){return `<button class="menu-row" data-act="go" data-key="${key}">${icon(ic)}<span class="grow">${text}</span>${detail?`<small>${detail}</small>`:''}${icon('chevron',16)}</button>`;}
function readonlyNote(){return note('当前为只读视图，历史留档不随模板和球员资料变化。','','历史资料');}
function feedback(){if(view.state==='conflict')return note('其他管理员已经更新此记录。当前输入仍保留，请核对后重新载入，不会强行覆盖。'+b('核对后重新载入','demo','outline'),'warning','有更新需要核对');if(['uncertain','pending'].includes(view.state))return note('网络中断，上次操作结果尚未确认。请先核对原任务，不要重复创建或上传。'+b('核对操作结果','demo','outline'),'warning','结果待核对');return '';}
function save(text='保存修改'){return `${feedback()}${b(text,'save','primary',view.state==='conflict'?'disabled':'')}<p class="hint small">示例仅用于界面演示，不写入真实数据。</p>`;}
function empty(title='这里还没有内容',copy='有记录后会显示在这里。',action=''){return `<div class="empty-state"><div class="state-symbol">${icon('calendar',29)}</div><h2>${title}</h2><p>${copy}</p>${action}</div>`;}
function pitch(extra=false,mini=false){const positions=[[50,90,1,'许宁'],[17,72,3,'陈川'],[39,76,4,'顾言'],[61,76,5,'方辰'],[83,72,2,'程越'],[24,49,6,'周泽'],[50,56,8,'陆鸣'],[76,49,16,'林远'],[20,24,7,'前锋'],[50,18,10,'前锋'],[80,24,11,'前锋']];return `<div class="pitch ${mini?'pitch-small':''}"><div class="pitch-boundary"></div><div class="pitch-centerline"></div><div class="pitch-circle"></div><div class="pitch-dot"></div><div class="penalty-box top"></div><div class="penalty-box bottom"></div><div class="six-box top"></div><div class="six-box bottom"></div><div class="pitch-goal top"></div><div class="pitch-goal bottom"></div>${extra?`<svg class="pitch-art" viewBox="0 0 330 500"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#8845a0"/></marker></defs><path d="M165 258 Q180 190 254 121" fill="none" stroke="#8845a0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M67 120L90 65" fill="none" stroke="#8845a0" stroke-width="2.5" marker-end="url(#arrow)"/></svg>`:''}${positions.map(([x,y,num,name])=>`<button class="player-piece" style="left:${x}%;top:${y}%" data-act="piece" aria-label="${num}号 ${name}">${num}<small>${name}</small></button>`).join('')}<span class="football-piece" style="left:52%;top:49%">●</span><span class="pitch-label">柏林花园 FC · 4-3-3</span></div>`;}
function photo(label='比赛照片示意',tall=false){return `<div class="photo-placeholder ${tall?'tall':''}"><span class="photo-ball">${icon('image',36)}</span><span class="photo-label">${label}</span></div>`;}
const R={};
R.home=()=>`<div class="club-lockup"><div class="grow"><div class="club-caption">BERLIN SECRET GARDEN</div><h1>柏林花园 FC</h1><div class="hero-tag">${isAdmin()?'管理员':'球员'} · 一起上场</div></div>${badge('lockup-badge')}</div>${view.state==='no-next'?`<div class="club-welcome"><h2>下一场，还在安排。</h2><p>发布后的比赛，会显示在这里。</p>${go('查看比赛记录 '+icon('arrow',16),'schedule','outline')}</div>`:nextMatch()}${section('球队这一年','<small>2026 年</small>')}<div class="club-stat-strip"><div><strong>16</strong><span>在队队员</span></div><div><strong>12</strong><span>本年完赛</span></div><div><strong>6</strong><span>胜场</span></div></div><p class="hint small">另有 2 位成员状态未确认</p>${section('最近赛果',link('全部比赛','schedule'))}<div class="results-deck">${[['胜','3 : 1','北岸联队','11.15',''],['平','1 : 1','长青 FC','11.08','draw'],['负','0 : 2','城市联队','11.01','loss']].map(([t,s,n,d,c])=>`<button class="result-ticket" data-act="go" data-key="match-detail" data-state="completed"><div class="between"><span class="recent-mark ${c}">${t}</span><small>${d}</small></div><strong>${s}</strong><span>${n}</span></button>`).join('')}</div>`;
R.schedule=()=>{const past=view.state==='past',draft=view.state==='draft';return `${heading('我们的比赛日','每一次相聚，都值得记录。')}${isAdmin()?go(icon('plus',17)+' 创建比赛','match-edit','outline'):''}${segment([['default','待比赛'],['past','已结束'],...(isAdmin()?[['draft','草稿']]:[])],past?'past':draft?'draft':'default')}<div class="month-label">2026 <strong>11月</strong></div>${(past?[[15,'北岸联队','3 : 1'],[8,'长青 FC','1 : 1'],[1,'城市联队','0 : 2']]:[[22,'绿茵联队','19:30'],[29,'河畔 FC','20:00']]).map(([day,name,time],i)=>`<button class="card schedule-card" data-act="go" data-key="${draft?'match-edit':'match-detail'}" data-state="${past?'completed':'default'}"><div class="row start"><div class="date-tile"><strong>${day}</strong><span>周日</span></div><div class="grow"><div class="between"><span class="fixture-opponent">${name}</span>${pill(past?'已完赛':draft?'草稿':'待比赛',past?'neutral':'')}</div><div class="fixture-meta">周末友谊赛 · 11人制</div><div class="meta-line">${icon('clock',15)} ${time}</div></div></div><div class="thin-rule"></div><div class="meta-line">${icon('pin',15)} ${i?'东岸运动中心 · 2号场':venue}</div>${!past&&!draft?`<div class="response-strip">${counts()}<span class="text-link">未回应 ›</span></div>`:''}</button>`).join('')}${!past&&!draft?'<div class="month-label">2026 <strong>12月</strong></div><div class="card"><div class="between"><strong>山谷联队</strong><span class="pill neutral">待比赛</span></div><div class="hint">12月6日 周日 · 时间待定</div><div class="meta-line">'+icon('pin',15)+' 地点待定</div></div>':''}`;};
R.players=()=>`${`<div class="roster-masthead"><div><div class="eyebrow">THE SQUAD</div><h1 class="page-title">一起上场的人</h1><p class="page-subtitle">柏林花园 FC · 球队名册</p></div><div class="squad-monogram" aria-hidden="true">FC</div></div>`}${segment([['default','在队球员'],['inactive','历史队员'],['unconfirmed','待确认']],view.state==='inactive'?'inactive':view.state==='unconfirmed'?'unconfirmed':'default')}<div class="search-row"><div class="search-box">${icon('search',18)}<input placeholder="搜索姓名或号码" value="${ESC(demo.search)}" data-input="search" aria-label="搜索球员"></div><button class="filter-btn" data-act="select" data-title="球员位置" data-options="全部位置|前锋|中场|后卫|门将">${demo.selected.position||'全部位置'}${icon('down',14)}</button></div>${view.state==='unconfirmed'?note('成员归属尚未确认，不计入在队人数。','warning'):''}${section(view.state==='inactive'?'历史队员':view.state==='unconfirmed'?'待确认球员':'在队球员',`<small>${view.state==='default'?'16':view.state==='inactive'?'3':'2'} 人</small>`)}<div class="list-card" id="players-list">${people.slice(0,view.state==='inactive'?3:view.state==='unconfirmed'?2:16).map(person).join('')}</div>`;
R.statistics=()=>`${heading('用比赛留下记录','只统计已完赛 · 未知不计作零')}<div class="field-grid">${select('统计范围',view.state==='season'?'2026–2027 赛季':'全部比赛',['全部比赛','2026–2027 赛季'],'statseason')}${view.state!=='season'?select('自然年','2026 年',['2026 年','2025 年'],'statyear'):''}</div><div class="card scope-card"><div class="between"><strong>${view.state==='season'?'2026–2027 赛季':'2026 年'}</strong>${pill('12 场完赛','neutral')}</div>${metrics([['6','胜'],['2','平'],['2','负']])}<div class="score-coverage"><span>进球 <b>32</b>　失球 <b>14</b></span><small>比分完整 10 / 12</small></div></div>${segment([['default','总排行'],['goals','进球榜'],['assists','助攻榜'],['appearances','出场榜']],['goals','assists','appearances'].includes(view.state)?view.state:'default')}<div class="card flush"><div class="rank-head"><span>球员</span><span>${view.state==='goals'?'进球':view.state==='assists'?'助攻':view.state==='appearances'?'出场':'进球　助攻　出场'}</span></div>${(view.state==='assists'?[people[1],people[0],people[2],people[4],people[3]]:people.slice(0,5)).map((p,i)=>`<button class="rank-row" data-act="go" data-key="player-detail"><span class="rank-index">${i+1}</span>${avatar(p)}<span class="grow"><span class="person-name">${p[0]}</span>${view.state==='goals'?`<span class="person-meta">已记录 ${10-i} 场</span>`:''}</span>${view.state==='goals'?`<strong class="rank-value">${[8,5,3,1,0][i]}</strong>`:view.state==='assists'?`<strong class="rank-value">${[6,4,2,1,0][i]}</strong>`:view.state==='appearances'?`<strong class="rank-value">${[10,9,8,7,6][i]}</strong>`:`<span class="rank-values"><b>${[8,5,3,1,0][i]}</b><b>${[4,6,2,'—',1][i]}</b><b>${10-i}</b></span>`}</button>`).join('')}</div><p class="hint">未录入名单 2 场。“—”表示未记录。总排行按进球、助攻、出场依次排序，不把缺失记录补成零。</p>${section('对手交锋')}<div class="card"><div class="between"><strong>北岸联队</strong><span class="pill neutral">2 胜 1 平 0 负</span></div><div class="hint">3 场交锋 · 3 场完整比分</div></div>`;
R.me=()=>`<div class="profile-hero"><div class="row">${avatar(people[0],true)}<div class="grow"><div class="profile-name">${isAdmin()?'球队管理员':'林远'}</div><div class="person-meta">柏林花园 FC</div><div style="margin-top:9px">${pill(view.role==='system'?'系统管理员':isAdmin()?'管理员':'球员')}</div></div>${!isAdmin()?`<div class="profile-number">10<small>号</small></div>`:''}</div></div>${isAdmin()?`${section('球队管理')}<div class="management-grid">${[['球队资料','manage-team','shield'],['球员与账号','manage-players','people'],['赛季管理','manage-seasons','calendar'],['球场管理','manage-venues','pin'],...(view.role==='system'?[['系统账号','system-accounts','lock']]:[])].map(([t,k,ic])=>`<button class="manage-tile" data-act="go" data-key="${k}">${icon(ic,23)}<span>${t}</span></button>`).join('')}</div>`:`${section('2026 年，我的报名')}${metrics([['10','参加','yes'],['2','请假','no'],['3','待定','maybe'],['1','未回应']],'compact')}<p class="hint">报名状态不等于实际出场。</p>`}${section('球队与账号')}<div class="card flush">${!isAdmin()?menu('我的球员资料','player-detail','user'):''}${menu('球队战术板','tactics','tactics')}<button class="menu-row" data-act="toggle-password">${icon('lock')}<span class="grow">修改密码</span>${icon('down',16)}</button></div>${view.state==='password'?`<div class="card">${field('当前密码','','请输入当前密码','password')}${field('新密码','','至少 10 个字符','password')}${b('保存并重新登录','save','primary')}</div>`:''}${b(icon('logout',18)+' 退出 / 切换账号','logout','ghost')}`;
R.login=()=>`<div class="login-art">${badge()}<div class="eyebrow">BERLIN SECRET GARDEN</div><h1>欢迎归队</h1><p>柏林花园 FC</p></div><div class="card login-card">${field('账号','','俱乐部账号')}${field('密码','','输入密码','password')}${view.state==='invalid'?note('账号或密码不正确，请检查后重试。','danger'):''}${b('登录','login','primary')}</div><div class="login-footer">使用球队分配的账号。<br>账号或密码问题请联系球队管理员。</div>${view.state==='wechat'?`<div class="card">${b('微信登录','demo','outline')}${go('接受球队邀请','wechat-claim','ghost','data-state="enabled"')}<p class="hint small">仅限已邀请并批准的成员，不开放注册。</p></div>`:''}`;
R['match-detail']=()=>{const complete=view.state==='completed',cancel=view.state==='cancelled';return `${complete?photo('已上传比赛封面 · 图片位置示意'):''}<div class="detail-hero"><div class="between"><div class="match-context">${pill(complete?'已完赛':cancel?'已取消':'待比赛',complete?'neutral':cancel?'red':'')}<span>周末友谊赛 · 11人制</span></div>${!complete&&!cancel?b(icon('share',18),'share','small ghost','aria-label="分享比赛"'):''}</div>${teams(complete?'3 : 1':'VS')}<div class="fact-row"><span class="fact-label">时间</span><div class="grow"><strong>11月22日 周日</strong><div class="person-meta">19:30 开球</div></div></div><div class="fact-row"><span class="fact-label">场地</span><div class="grow"><strong>${venue}</strong><div class="person-meta">球场地址由管理员维护</div></div>${b('导航 ›','map','small')}</div><div class="fact-row"><span class="fact-label">须知</span><div class="grow">请提前到场热身，准备好球鞋和护腿板。</div></div><div class="button-row">${isAdmin()?go('编辑比赛','match-edit','outline compact'):''}${isAdmin()?go('管理名单','match-roster','outline compact'):''}</div>${link('须知与相册','match-media')}</div>${view.state==='pending'?feedback():''}${cancel?note('本场比赛已取消，无法更改报名。','warning'):''}${section('报名情况',`<small>13 人已回应</small>`)}${counts()}${[['参加',people.slice(0,8),'yes'],['待定',people.slice(8,11),'maybe'],['请假',people.slice(11,13),'no']].map(([l,ps,c])=>`<div class="signup-group"><div class="signup-group-title ${c}">${l} <span>${c==='yes'?8:ps.length}</span></div><div class="reply-grid">${ps.map(p=>`<div class="reply-person">${avatar(p)}<span>${p[0]}</span></div>`).join('')}</div>`).join('')}${section('比赛名单',`<small>实际出场与表现</small>`)}<div class="card flush">${people.slice(0,3).map((p,i)=>`<div class="person-row">${avatar(p)}<div class="grow"><div class="person-name">${p[1]} · ${p[0]}</div><div class="person-meta">${complete?'已出场':'出场待确认'} · ${i===2?'替补':'首发'}</div></div><div class="person-meta">进球 ${complete?(i===0?'2':'0'):'—'}<br>助攻 ${complete?(i===0?'—':'1'):'—'}</div></div>`).join('')}</div><p class="hint small">报名不等于实际出场；“—”表示未记录。名单使用本场留存身份。</p>${complete?`${section('赛后复盘')}<div class="card">边路配合更流畅，后场出球仍需加强。下场继续保持沟通和回防节奏。</div>`:''}${section('战术留档')}<div class="card flush">${menu('4-3-3 前场压迫','tactic-board','tactics','关联时留存')}</div>`;};
R['player-detail']=()=>`<div class="profile-hero"><div class="row">${avatar(people[0],true)}<div class="grow"><div class="profile-name">林远</div>${pill('在队','green')}</div><div class="profile-number">10<small>号</small></div></div><div class="profile-facts"><div><small>位置</small><strong>前锋</strong></div><div><small>惯用脚</small><strong>右脚</strong></div></div></div><div class="card flush">${menu('出场照片','player-photos','image')}</div>${section('比赛表现','<small>2026 年</small>')}<div class="card">${metrics([['10','确认出场'],['8','进球'],[view.state==='unknown'?'—':'4','助攻']])}<div class="thin-rule"></div><p class="hint">进球有记录 9 场 · 助攻有记录 ${view.state==='unknown'?'0':'8'} 场<br>出场待确认 1 场 · 未录入名单 2 场<br>“—”表示未记录</p></div>${section('报名记录','<small>2026 年</small>')}${metrics([['10','参加','yes'],['3','待定','maybe'],['2','请假','no'],['1','未回应']],'compact')}`;
R['match-edit']=()=>`${heading('安排一场比赛','草稿仅管理员可见，发布后球员才能报名。')}<div class="card">${field('对手 *','绿茵联队','对手名称')}${field('赛事','周末友谊赛','例如：周末友谊赛')}<div class="field-grid">${select('日期 *','2026-11-22 周日',['日期'],'matchdate')}${select('开球时间','19:30',['时间'],'matchtime')}</div>${b('清除开球时间','clear-time','ghost small')}${select('选择球场',venue,[venue,'东岸运动中心 · 2号场','不选择球场'],'venue')}${field('地点',venue,'球场名称或地址')}<div class="field-grid">${select('人数制','11 人制',['5 人制','6 人制','7 人制','8 人制','9 人制','11 人制'],'format')}${select('主客场','主场',['主场','客场','中立场','未确定'],'side')}</div>${field('报名人数','22','不限（留空）','number','仅“参加”计入人数，留空表示不限。')}${select('所属赛季','2026–2027 赛季',['不指定赛季','2026–2027 赛季'],'season')}${select('比赛状态',view.state==='completed'?'已完赛':'草稿',['草稿','发布报名','已完赛','已取消'],'matchstatus')}</div><div class="card"><h2 class="card-heading">比分与复盘</h2><div class="field-grid">${field('我方比分',view.state==='completed'?'3':'','未知','number')}${field('对方比分',view.state==='completed'?'1':'','未知','number')}</div>${area('赛后复盘','','记录这场比赛的收获')}<p class="hint">只有已完赛比赛计入统计。比分未知请留空，不能自动填 0。</p></div>${save(view.state==='completed'?'保存比赛':'保存草稿')}`;
R['manage-team']=()=>`${heading('球队设置','球队名称与队徽，保持统一的俱乐部身份。')}<div class="card">${field('球队名称','柏林花园 FC')}<label class="field-label">队徽</label><div class="crest-editor">${badge()}</div><div class="button-row">${b(icon('image',18)+' 选择图片','upload','outline')}${b('移除队徽','remove','ghost')}</div><p class="hint">PNG / JPG，最大 2 MB。队徽按原始比例完整展示。</p></div>${save('保存设置')}`;
R['manage-players']=()=>`${heading('球员管理','维护资料、成员状态与登录账号。')}${go(icon('plus',18)+' 新增球员','manage-player','primary')}<div style="margin-top:16px"><div class="search-box">${icon('search',18)}<input placeholder="搜索姓名或号码" aria-label="搜索姓名或号码"></div></div>${segment([['default','在队'],['archived','已归档'],['unconfirmed','待确认']],view.state)}<div class="card flush">${people.slice(0,5).map((p,i)=>`<button class="person-row" data-act="go" data-key="manage-player">${avatar(p)}<span class="grow"><span class="person-name">${p[0]} <small>${p[1]}号</small></span><span class="person-meta">${p[2]}</span></span>${pill(i===4?'未开通账号':'已开通账号',i===4?'neutral':'green')}${icon('chevron',15)}</button>`).join('')}</div>`;
R['manage-player']=()=>`${heading('编辑球员','资料、照片与账号分开管理。')}<div class="card"><div class="row">${avatar(people[0],true)}<div class="grow">${b('选择头像','upload','outline compact')}${b('移除头像','remove','ghost small')}</div>${pill(view.state==='archived'?'已归档':'在队',view.state==='archived'?'neutral':'green')}</div><p class="hint">PNG / JPG，最大 2 MB</p>${field('姓名 *','林远')}${field('号码','10','未知可留空','number')}<div class="field"><label class="field-label">位置 · 可多选</label><div class="chip-grid">${['前锋','中场','后卫','门将'].map((x,i)=>`<button class="chip ${i===0?'active':''}" data-act="chip">${x}</button>`).join('')}</div></div>${select('惯用脚','右脚',['未设置','左脚','右脚','双脚'],'foot')}${select('成员状态',view.state==='archived'?'已归档':'在队',['在队','已归档','状态未确认'],'memberstate')}${area('备注','','仅记录与球队管理相关的信息')}</div>${save('保存球员')}<div class="card flush">${menu('管理出场照片','player-photos','image')}${menu('微信邀请与绑定','wechat-invites','mail')}</div><div class="card"><div class="between"><h2 class="card-heading">登录账号</h2>${pill('已开通','green')}</div><p class="hint">重置密码后，需要重新登录。</p>${field('新密码','','至少 10 个字符','password')}${b('确认重置密码','danger-confirm','outline')}</div>${b(view.state==='archived'?'恢复球员':'归档球员','danger-confirm','danger')}`;
R['manage-seasons']=()=>`${heading('赛季管理','自定义起止周期，可跨自然年。')}${go(icon('plus',18)+' 新增赛季','manage-season','primary')}${note('比赛需要明确选择所属赛季；时间范围重叠不会自动合并统计。')}${[['2026–2027 赛季','2026-09-01 至 2027-06-30'],['2026 春季赛','2026-03-01 至 2026-07-31']].map(([n,d])=>`<button class="card season-card" data-act="go" data-key="manage-season"><div class="between"><strong>${n}</strong>${icon('chevron',18)}</div><div class="hint">${d}</div></button>`).join('')}`;
R['manage-season']=()=>`${heading('编辑赛季')}<div class="card">${field('赛季名称 *','2026–2027 赛季')}${select('开始日期 *','2026-09-01',['日期'],'seasonstart')}${select('结束日期 *','2027-06-30',['日期'],'seasonend')}<p class="hint">包含起止当天，已有比赛日期不能被排除在赛季之外。</p></div><div class="card flush">${menu('管理赛季阵容','season-roster','people')}</div>${save('保存赛季')}`;

function album(player=false){const ro=!isAdmin()||view.state==='readonly';return `${heading(player?'林远 · 出场照片':'比赛须知与相册',player?'10号 · 头像与照片集独立':'对阵绿茵联队')}${!player?`${section('比赛须知')}<div class="card">${ro?'<p>请提前到场热身，准备好球鞋和护腿板。</p>':area('集合与装备提醒','请提前到场热身，准备好球鞋和护腿板。')}${!ro?b('保存须知','save','primary'):''}</div>`:(!ro?go(icon('spark',18)+' 出场照与头像生成','player-ai','outline'):'')}${section(player?'球员出场照片':'比赛相册',`<small>${ro?'2 张':'2 / 9'}</small>`)}${!ro?'<p class="hint">仅上传已获授权的照片，每张最多 2 MB。</p>':''}${[0,1].map((x)=>`<div class="card flush">${photo(x?'赛后合影位置示意':'出场照片位置示意',player)}<div class="photo-caption"><div class="between"><strong>${x?'一起踢球的日子':'本场精彩瞬间'}</strong>${x?'':pill('封面')}</div>${!ro?`${player?field('照片说明','本场精彩瞬间'):''}<div class="photo-controls">${player?b('保存说明','save','outline compact'):''}${b('设为封面','save','outline compact')}${b('移除','remove','ghost compact')}</div><div class="photo-controls">${b('上移','demo','ghost small',x===0?'disabled':'')}${b('下移','demo','ghost small',x===1?'disabled':'')}</div>`:''}</div></div>`).join('')}${!ro?`<div class="card"><button class="upload-target" data-act="upload">${icon('plus',26)}<strong>选择照片</strong><span>PNG / JPG · 最多 2 MB</span></button>${field('照片说明（可选）','','说说这张照片')}${feedback()}${b(view.state==='uncertain'?'核对并重试上传':'上传照片','save','primary')}</div>${b('重新载入','demo','outline')}`:''}`;}
R['match-media']=()=>album(false);R['player-photos']=()=>album(true);
R.tactics=()=>`${heading(view.state==='historical'?'本场战术留档':'球队战术','竖向球场，查看站位与配合。')}${isAdmin()&&view.state!=='historical'?`<div class="button-row">${go(icon('plus',17)+' 新建战术','tactic-create','primary')}${go('导入 / 导出','tactic-transfer','outline')}</div>`:readonlyNote()}<div class="search-box" style="margin:18px 0">${icon('search',18)}<input placeholder="搜索战术或阵型" aria-label="搜索战术或阵型"></div>${[['前场压迫','4-3-3','11'],['边路推进','4-2-3-1','11'],['快速转换','2-3-1','7']].map(([n,f,c])=>`<button class="card tactic-card" data-act="go" data-key="tactic-board" data-state="${view.state==='historical'?'readonly':'default'}"><div class="mini-pitch"><i></i></div><div class="grow"><strong>${n}</strong><div class="person-meta">${c} 人制 · ${f}</div>${pill(view.state==='historical'?'关联时留存 · 只读':isAdmin()?'当前模板 · 可编辑':'当前模板 · 只读','neutral')}</div>${icon('chevron',16)}</button>`).join('')}`;
R['tactic-board']=()=>{const edit=isAdmin()&&view.state==='editing',ro=!isAdmin()||view.state==='readonly',focus=view.state==='focus';return `${!focus&&!edit?`<div class="board-title"><div><h1 class="page-title">前场压迫</h1><div class="board-caption">11 人制 · 4-3-3</div></div>${pill(edit?'编辑中':ro?'只读':'当前模板',edit?'':'neutral')}</div>`:''}${edit?'<div class="board-edit-caption"><span>11 人制 · 4-3-3</span><span class="pill">编辑中</span></div>':''}${ro?'<div class="hint small">'+(view.state==='readonly'?'比赛留档 · 关联时留存':'球员视角 · 仅查看与播放')+'</div>':''}${edit?`<div class="button-row">${b('取消','state','outline compact','data-value="default"')}${b('保存战术','save','primary compact')}</div><div class="tactic-toolbar">${b(icon('edit',17)+' 工具','tools','outline compact')}${b(icon('undo',17)+' 撤销','demo','ghost compact')}${b('重做','demo','ghost compact')}${b('属性','properties','outline compact')}</div>`:`<div class="row">${select('查看阶段','阶段 1 · 初始站位',['阶段 1 · 初始站位','阶段 2 · 边路推进','阶段 3 · 禁区接应'],'stage')}${b(focus?'展开工具':'专注球场','state','ghost compact',`data-value="${focus?'default':'focus'}"`)}</div><div class="playback">${b(icon(demo.played?'pause':'play',16)+(demo.played?'暂停':'播放演示'),'play','outline compact')}<input type="range" min="0" max="12" value="0" aria-label="演示进度"><span>0 / 12 秒</span></div>`}${pitch(true)}${!edit&&!focus?`<div class="button-grid" style="margin-top:14px">${go('导出图片 / PDF','tactic-export','outline')}${!ro?go('阵型与战术信息','tactic-setup','outline'):''}${!ro?go('动画与球员','tactic-compose','outline'):''}${!ro?b('编辑战术画布','state','primary','data-value="editing"'):''}</div><div class="card" style="margin-top:16px"><h2 class="card-heading">战术目标</h2><p>前场形成压迫，边路保持接应宽度。移动与路径仅为设计示意。</p></div>`:''}${edit?'<p class="hint small">原型仅展示工具布局。真实拖拽、曲线和坐标变换继续使用仓库画布实现。</p>':''}`;};
R['tactic-compose']=()=>`${heading('动画与球员','前场压迫 · 当前模板')}${segment([['default','动画阶段'],['properties','球员属性']],view.state==='properties'?'properties':'default')}<div class="button-row">${b(icon('undo',16)+' 撤销','demo','outline compact')}${b('保存修改','save','primary compact')}</div>${feedback()}${view.state==='properties'?`<div class="card" style="margin-top:16px">${select('属性作用范围','当前画布',['当前画布','演示参与者'],'target')}${note('只修改所选范围，不自动同步另一范围，也不修改球员档案或历史比赛。','warning')}${select('选择球员','10号 · 林远',['10号 · 林远','8号 · 周泽'],'piece')}${field('名称','林远')}${field('号码','10','未编号','number')}${select('位置','前锋',['未设置','前锋','中场','后卫','门将'],'pieceposition')}${b('应用属性','save','primary')}</div>`:`<div class="card" style="margin-top:16px">${select('演示阶段','阶段 2 · 边路推进',['阶段 1 · 初始站位','阶段 2 · 边路推进','阶段 3 · 禁区接应'],'composestage')}<div class="button-row">${b('复制追加','demo','outline compact')}${b('删除阶段','danger-confirm','ghost compact')}</div><div style="margin-top:14px">${field('阶段标题','边路推进')}${select('阶段时长','4 秒',['1 秒','2 秒','3 秒','4 秒','5 秒','6 秒'],'duration')}${b('应用阶段设置','demo','outline')}</div></div><div class="tactic-toolbar">${b('移动球员','tools','outline compact')}${b('曲线路径','properties','outline compact')}${b('专注球场','demo','ghost compact')}</div>${pitch(true)}<p class="hint">时长表示从上一阶段到本阶段的过渡。首阶段不计时；阶段变化会移除受影响的相邻曲线。最多 120 个阶段，不提供任意拖拽重排。</p>`}`;

R['tactic-setup']=()=>`${heading('阵型与战术信息')}<div class="card"><h2 class="card-heading">战术信息</h2>${field('名称','前场压迫')}${area('标签 · 每行一个','压迫\n边路配合')}<div class="switch-row"><span>收藏</span><button class="switch" data-act="switch" aria-label="收藏"></button></div>${b('保存信息','save','outline')}</div>${section('阵型与双方阵容')}<div class="card"><div class="field-grid">${select('比赛制式','11 人制',['5 人制','6 人制','7 人制','8 人制','9 人制','11 人制'],'tacticcount')}${select('阵容归属','主队',['主队','客队'],'team')}</div>${select('阵型方案','4-3-3',['4-3-3','4-4-2','4-2-3-1'],'formation')}${note('只改变所选方。切换人数可能同时调整双方阵容，确认前应展示增减人数。已有演示不会自动同步新阵容。','warning')}${['门将','左后卫','中后卫','中后卫','右后卫','中场','中场','中场','左前锋','中锋','右前锋'].map((pos,i)=>`<div class="slot-row"><span class="slot-number">${i+1}</span><span class="slot-position">${pos}</span><button class="select-control" data-act="select" data-title="槽位球员" data-options="匿名球员|林远|周泽|陈川|许宁"><span>${i<4?people[i][0]:'匿名球员'}</span>${icon('down',14)}</button></div>`).join('')}<p class="hint">同一球员只能占一个位置。</p>${feedback()}${b('应用所选方阵型与阵容','danger-confirm','primary')}</div>${section('初始画布预览')}${pitch()}<p class="hint">保存不修改历史比赛快照。</p>`;

function clubBanner(title,subtitle='',eyebrow='BERLIN SECRET GARDEN',jersey=false){return `<div class="club-page-banner ${jersey?'jersey':''}"><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p>${badge('banner-mark')}</div>`;}
function fixtureHero(){return `<div class="club-fixture-hero"><div class="match-context">${pill('焦点赛事')}<span>周末友谊赛 · 11 人制</span></div>${teams()}<div class="meta-line">${icon('calendar',14)}11月22日 周日 · 19:30</div><div class="meta-line">${icon('pin',14)}${venue}</div>${go(icon('people',17)+' 查看比赛 · 去报名','match-detail','primary')}</div>`;}
function quickLinks(items){return `<div class="club-quick">${items.map(([text,key,ic])=>`<button data-act="go" data-key="${key}">${icon(ic,23)}<span>${text}</span></button>`).join('')}</div>`;}

R.home=()=>`<section class="club-hero"><div class="club-hero-copy"><span class="hero-club-kicker">足球 · 伙伴 · 花园</span><h1>一起踢球，<br>更好的我们。</h1><small>BERLIN SECRET GARDEN FC</small></div></section>${view.state==='no-next'?`<div class="club-welcome"><h2>下一场，还在安排。</h2><p>比赛发布后，会显示在这里。</p>${go('查看比赛记录 '+icon('arrow',16),'schedule','outline')}</div>`:compactNext()}${quickLinks([['比赛','schedule','calendar'],['球员','players','people'],['数据','statistics','chart'],['战术','tactics','tactics']])}${section('近期赛果',link('全部比赛','schedule'))}<div class="results-deck">${[['胜','3 : 1','北岸联队','11.15',''],['平','1 : 1','长青 FC','11.08','draw'],['负','0 : 2','城市联队','11.01','loss']].map(([t,s,n,d,c])=>`<button class="result-ticket" data-act="go" data-key="match-detail" data-state="completed"><div class="between"><span class="recent-mark ${c}">${t}</span><small>${d}</small></div><strong>${s}</strong><span>${n}</span></button>`).join('')}</div>${section('球队这一年','<small>2026 年</small>')}<div class="club-stat-strip"><div><strong>16</strong><span>在队队员</span></div><div><strong>12</strong><span>本年完赛</span></div><div><strong>6</strong><span>胜场</span></div></div><p class="hint small">另有 2 位成员状态未确认</p>`;
R.schedule=()=>{const past=view.state==='past',draft=view.state==='draft';return `${!past&&!draft?fixtureHero():clubBanner(past?'每一场，都值得记录':'下一场，从这里开始',past?'赛果与复盘 · 留住一起上场的瞬间':'比赛发布后，球员才能报名','MATCHDAY')}${isAdmin()?go(icon('plus',17)+' 创建比赛','match-edit','outline'):''}${segment([['default','待比赛'],['past','已结束'],...(isAdmin()?[['draft','草稿']]:[])],past?'past':draft?'draft':'default')}<div class="month-label">2026 <strong>11月</strong></div>${(past?[[15,'北岸联队','3 : 1'],[8,'长青 FC','1 : 1'],[1,'城市联队','0 : 2']]:[[22,'绿茵联队','19:30'],[29,'河畔 FC','20:00']]).map(([day,name,time],i)=>`<button class="schedule-card" data-act="go" data-key="${draft?'match-edit':'match-detail'}" data-state="${past?'completed':'default'}"><div class="row start"><div class="date-tile"><strong>${day}</strong><span>周日</span></div><div class="grow"><div class="between"><span class="fixture-opponent">${name}</span>${pill(past?'已完赛':draft?'草稿':'待比赛',past?'neutral':'')}</div><div class="fixture-meta">周末友谊赛 · 11人制</div><div class="meta-line">${icon(past?'trophy':'clock',14)}${time}</div></div></div><div class="thin-rule"></div><div class="meta-line">${icon('pin',14)}${i?'东岸运动中心 · 2号场':venue}</div>${!past&&!draft?`<div class="response-strip">${counts()}<span class="text-link">去报名 ›</span></div>`:''}</button>`).join('')}${!past&&!draft?`<div class="month-label">2026 <strong>12月</strong></div><button class="schedule-card" data-act="go" data-key="match-detail"><div class="between"><strong>山谷联队</strong>${pill('待比赛','neutral')}</div><div class="hint">12月6日 周日 · 时间待定</div><div class="meta-line">${icon('pin',14)}地点待定</div></button>`:''}`;};
R.players=()=>`${clubBanner('柏林花园 FC','一起上场的人 · 球队名册','OUR TEAM',true)}<div class="squad-stat-cards"><button data-act="state" data-value="default">${icon('people',19)}<strong>16</strong><span>在队球员</span></button><button data-act="state" data-value="inactive">${icon('trophy',19)}<strong>3</strong><span>历史队员</span></button><button data-act="state" data-value="unconfirmed">${icon('shield',19)}<strong>2</strong><span>状态待确认</span></button></div>${segment([['default','在队球员'],['inactive','历史队员'],['unconfirmed','待确认']],view.state==='inactive'?'inactive':view.state==='unconfirmed'?'unconfirmed':'default')}<div class="search-row"><div class="search-box">${icon('search',18)}<input placeholder="搜索姓名或号码" value="${ESC(demo.search)}" data-input="search" aria-label="搜索球员"></div><button class="filter-btn" data-act="select" data-title="球员位置" data-options="全部位置|前锋|中场|后卫|门将" data-selectid="position"><span>${demo.selected.position||'全部位置'}</span>${icon('down',14)}</button></div>${view.state==='unconfirmed'?note('成员归属尚未确认，不计入在队人数。','warning'):''}${section(view.state==='inactive'?'历史队员':view.state==='unconfirmed'?'待确认球员':'球员名单',`<small>${view.state==='inactive'?'3':view.state==='unconfirmed'?'2':'16'} 人</small>`)}<div class="list-card" id="players-list">${people.slice(0,view.state==='inactive'?3:view.state==='unconfirmed'?2:16).map(person).join('')}</div>`;
R.statistics=()=>`<div class="statistics-title"><div class="eyebrow">THE CLUB RECORDS</div><h1>每一场，都算数。</h1><p>比赛留下成绩，也留下我们的故事。</p></div><div class="card scope-card"><div class="between"><strong class="scope-title">${view.state==='season'?'2026–2027 赛季':'2026 年'}</strong>${pill('12 场完赛','neutral')}</div>${metrics([['6','胜'],['2','平'],['2','负']])}<div class="score-coverage"><span>进球 <b>32</b>　失球 <b>14</b></span><span>比分完整 10 / 12</span></div><p class="record-coverage">另 2 场比分未完整记录，不计入胜平负。</p></div><div class="field-grid">${select('统计范围',view.state==='season'?'2026–2027 赛季':'全部比赛',['全部比赛','2026–2027 赛季'],'statseason')}${view.state!=='season'?select('自然年','2026 年',['2026 年','2025 年'],'statyear'):''}</div>${section('球员榜单')} ${segment([['default','总排行'],['goals','进球榜'],['assists','助攻榜'],['appearances','出场榜']],['goals','assists','appearances'].includes(view.state)?view.state:'default')}<div class="card flush"><div class="rank-head"><span>球员</span><span>${view.state==='goals'?'进球':view.state==='assists'?'助攻':view.state==='appearances'?'出场':'进球　助攻　出场'}</span></div>${(view.state==='assists'?[people[1],people[0],people[2],people[4],people[3]]:people.slice(0,5)).map((p,i)=>`<button class="rank-row" data-act="go" data-key="player-detail"><span class="rank-index">${i+1}</span>${avatar(p)}<span class="grow"><span class="person-name">${p[0]}</span>${view.state==='goals'?`<span class="person-meta">已记录 ${10-i} 场</span>`:''}</span>${view.state==='goals'?`<strong class="rank-value">${[8,5,3,1,0][i]}</strong>`:view.state==='assists'?`<strong class="rank-value">${[6,4,2,1,0][i]}</strong>`:view.state==='appearances'?`<strong class="rank-value">${[10,9,8,7,6][i]}</strong>`:`<span class="rank-values"><b>${[8,5,3,1,0][i]}</b><b>${[4,6,2,'—',1][i]}</b><b>${10-i}</b></span>`}</button>`).join('')}</div><p class="hint small">未录入名单 2 场。“—”表示未记录，报名不等于实际出场。</p>${section('对手交锋')}<div class="card"><div class="between"><strong>北岸联队</strong>${pill('2 胜 1 平 0 负','neutral')}</div><div class="hint">3 场交锋 R.me=()=>`<div class="profile-hero"><div class="row">${avatar(isAdmin()?['管','',view.role==='system'?'系统管理员':'管理员','']:people[0],true)}<div class="grow"><div class="profile-name">${isAdmin()?'球队管理员':'林远'}</div><div class="person-meta">柏林花园 FC · ${isAdmin()?'球队管理':'球队成员'}</div><div style="margin-top:9px">${pill(view.role==='system'?'系统管理员':isAdmin()?'管理员':'10 号 · 前锋')}</div></div>${!isAdmin()?`<div class="profile-number">10<small>球员号码</small></div>`:''}</div></div>${!isAdmin()?`${quickLinks([['我的资料','player-detail','user'],['球队比赛','schedule','calendar'],['出场照片','player-photos','image'],['球队战术','tactics','tactics']])}${section('我的报名','<small>2026 年</small>')}${metrics([['10','参加','yes'],['2','请假','no'],['3','待定','maybe'],['1','未回应']],'compact')}<p class="hint small">报名状态不等于实际出场。</p>`:`${section('球队管理')}<div class="management-grid">${[['球队资料','manage-team','shield'],['球员与账号','manage-players','people'],['赛季管理','manage-seasons','calendar'],['球场管理','manage-venues','pin'],...(view.role==='system'?[['系统账号','system-accounts','lock']]:[])].map(([t,k,ic])=>`<button class="manage-tile" data-act="go" data-key="${k}">${icon(ic,23)}<span>${t}</span></button>`).join('')}</div>`}${section('球队与账号')}<div class="card flush">${!isAdmin()?menu('我的球员资料','player-detail','user','林远 · 10号'):''}${menu('球队战术板','tactics','tactics')}${menu('球队数据','statistics','trophy','赛季与自然年')}<button class="menu-row" data-act="toggle-password">${icon('lock')}<span class="grow">修改密码</span>${icon('down',16)}</button></div>${view.state==='password'?`<div class="card">${field('当前密码','','请输入当前密码','password')}${field('新密码','','至少 10 个字符','password')}${b('保存并重新登录','save','primary')}</div>`:''}${b(icon('logout',18)+' 退出 / 切换账号','logout','ghost')}`;
R['match-detail']=()=>{const complete=view.state==='completed',cancel=view.state==='cancelled';return `<div class="detail-hero"><div class="match-hero-v3"><div class="between"><div class="match-context">${pill(complete?'已完赛':cancel?'已取消':'待比赛',complete?'neutral':cancel?'red':'')}<span>周末友谊赛 · 11人制</span></div>${!complete&&!cancel?b(icon('share',18),'share','small ghost','aria-label="分享比赛"'):''}</div>${teams(complete?'3 : 1':'VS')}<div class="hero-date">11月22日 周日 · 19:30 开球</div></div><div class="match-facts-v3"><div class="fact-row"><span class="fact-label">场地</span><div class="grow"><strong>${venue}</strong><div class="person-meta">球场地址由管理员维护</div></div>${b('导航 ›','map','small')}</div><div class="fact-row"><span class="fact-label">须知</span><div class="grow">请提前到场热身，准备好球鞋和护腿板。</div></div>${isAdmin()?`<div class="button-row">${go('编辑比赛','match-edit','outline compact')}${go('管理名单','match-roster','outline compact')}</div>`:''}${link('须知与相册','match-media')}</div></div>${view.state==='pending'?feedback():''}${cancel?note('本场比赛已取消，无法更改报名。','warning'):''}${section('报名情况','<small>13 人已回应</small>')}${counts()}${[['参加',people.slice(0,8),'yes'],['待定',people.slice(8,11),'maybe'],['请假',people.slice(11,13),'no']].map(([l,ps,c])=>`<div class="signup-group"><div class="signup-group-title ${c}">${l} <span>${c==='yes'?8:ps.length}</span></div><div class="reply-grid">${ps.map(p=>`<div class="reply-person">${avatar(p)}<span>${p[0]}</span></div>`).join('')}</div>`).join('')}${section('比赛名单','<small>实际出场与表现</small>')}<div class="card flush">${people.slice(0,3).map((p,i)=>`<div class="person-row">${avatar(p)}<div class="grow"><div class="person-name">${p[1]} · ${p[0]}</div><div class="person-meta">${complete?'已出场':'出场待确认'} · ${i===2?'替补':'首发'}</div></div><div class="person-meta">进球 ${complete?(i===0?'2':'0'):'—'}<br>助攻 ${complete?(i===0?'—':'1'):'—'}</div></div>`).join('')}</div><p class="hint small">报名不等于实际出场；“—”表示未记录。名单使用本场留存身份。</p>${complete?`${section('赛后复盘')}<div class="card">边路配合更流畅，后场出球仍需加强。下场继续保持沟通和回防节奏。</div>${section('比赛相册',link('查看','match-media'))}${photo('场景素材示意 · 非真实比赛照片')}`:''}${section('战术留档')}<div class="card flush">${menu('4-3-3 前场压迫','tactic-board','tactics','关联时留存')}</div>`;};
// Admin/utility pages receive a restrained club header, never a giant marketing hero.
const brandedUtility=['match-edit','manage-team','manage-players','manage-seasons','manage-season','manage-venues','manage-venue','match-roster','season-roster','match-media','tactics','tactic-transfer','tactic-export','player-photos','wechat-claim','wechat-invites','player-ai','tactic-create','force-password','system-accounts'];
for(const key of brandedUtility){const old=R[key];if(!old)continue;R[key]=()=>{let content=old();const spec=SPEC.pages.find(x=>x.key===key);content=content.replace(/<h1 class="page-title">[^<]*<\/h1>(?:<p class="page-subtitle">[^<]*<\/p>)?/,'');return clubBanner(spec.title,'柏林花园 FC · '+(spec.role==='admin'?'球队管理':'球队服务'),'BERLIN FC')+content;};}

function genericState(){if(view.state==='loading')return `<div aria-label="正在加载"><div class="skeleton title"></div><div class="skeleton line" style="width:64%"></div><div class="skeleton box"></div><div class="skeleton line" style="width:48%;margin:25px 0 16px"></div>${[1,2,3,4].map(()=>'<div class="skeleton row-fill"></div>').join('')}<p class="state-note">正在载入，不展示其他账号的旧数据。</p></div>`;if(view.state==='error')return `<div class="empty-state"><div class="state-symbol">${icon('refresh',29)}</div><h2>暂时无法加载</h2><p>请检查网络连接后重试。<br>已输入的内容不会被自动清空。</p>${b('重新加载','state','primary','data-value="default"')}</div>`;if(view.state==='empty')return empty(view.key==='players'?'没有找到球员':view.key==='tactics'?'暂无匹配的战术':'还没有相关记录',view.key==='players'?'试试调整搜索内容或位置。':'确认有数据后，会在这里显示。',b('返回默认示例','state','outline','data-value="default"'));return null;}
function parse(){let [key,query='']=location.hash.slice(1).split('?');if(!SPEC.pages.some(p=>p.key===key))key='home';const q=new URLSearchParams(query);view.key=key;view.state=q.get('state')||'default';view.role=q.get('role')||(key==='system-accounts'?'system':adminKeys.has(key)?'admin':'player');view.width=Number(q.get('width'))||375;}
function navigate(key,opts={}){const role=opts.role||((key==='system-accounts')?'system':adminKeys.has(key)&&view.role==='player'?'admin':view.role);const state=opts.state||'default';location.hash=`${key}?role=${role}&state=${state}&width=${view.width}`;}
function render(){parse();const p=SPEC.pages.find(x=>x.key===view.key);$('#studio-title').textContent=p.title;$('#artboard-id').textContent=`${p.id} / ${p.title}`;document.documentElement.style.setProperty('--phone-width',view.width+'px');$('#role-select').value=view.role;$('#width-select').value=String(view.width);const states=[...BASE_STATES,...(variants[view.key]||[])];if(!states.some(x=>x[0]===view.state))states.push([view.state,view.state==='assists'?'助攻榜':view.state==='appearances'?'出场榜':view.state]);$('#state-select').innerHTML=states.map(([v,t])=>`<option value="${v}" ${view.state===v?'selected':''}>${t}</option>`).join('');const isTab=tabs.some(t=>t[0]===view.key);$('#native-nav').innerHTML=`${!isTab?`<button class="back" data-act="back" aria-label="返回">${icon('back',22)}</button>`:''}${view.key==='home'?`<div class="nav-lockup">${badge()}<div><strong>柏林花园 FC</strong><small>Berlin Secret Garden FC</small></div></div>`:`<span class="native-title">${tabs.find(t=>t[0]===view.key)?.[1]||p.title}</span>`}<div class="capsule" aria-label="微信原生胶囊示意"><span class="capsule-dots">···</span><span class="capsule-dot">⊙</span></div>`;
const forbidden=(adminKeys.has(view.key)&&!isAdmin())||(view.key==='system-accounts'&&view.role!=='system');
$('#screen').className='screen screen-'+view.key;
 $('#screen').innerHTML=forbidden?empty('无权访问此功能','当前身份没有管理权限。实际权限仍由服务端校验。',go('返回我的','me','primary')):(genericState()??R[view.key]());
$('#tabbar').innerHTML=isTab?`<nav class="tabbar">${tabs.map(([k,t,ic])=>`<button class="${k===view.key?'active':''}" data-act="go" data-key="${k}">${icon(ic,22)}<span>${t}</span></button>`).join('')}</nav>`:'';
let canReply=view.key==='match-detail'&&(view.role==='player'||view.state==='admin-player')&&!['loading','error','empty','completed','cancelled'].includes(view.state);
const response=view.state==='selected'?'yes':demo.reply;
$('#bottom-actions').innerHTML=canReply?`<div class="bottom-panel"><div class="label-line"><strong>我的报名</strong><span>${view.state==='pending'?'结果待核对':response?'已选择：'+{yes:'参加',maybe:'待定',no:'请假'}[response]:'请选择'}</span></div><div class="button-row">${[['yes','参加'],['maybe','待定'],['no','请假']].map(([v,t])=>`<button class="btn reply-btn ${response===v?'selected':''}" data-act="reply" data-value="${v}" ${view.state==='pending'?'disabled':''}>${response===v?icon('check',16):''}${t}</button>`).join('')}</div></div>`:'';
$('#overlay').innerHTML='';$('#screen-scroll').scrollTop=0;
$('#inspector').innerHTML=`<span class="stamp">${p.id} · ${p.group}</span><h2>${p.title}</h2><p>${p.layout}</p><h3>对应源文件</h3><code>${p.source}</code><h3>必须保留</h3><p class="scope-warning">${p.guard}</p><h3>页面内容</h3><ul>${p.fields.map(x=>`<li>${x}</li>`).join('')}</ul><h3>重点状态</h3><p>${p.states.join(' / ')}</p><h3>业务事件与数据</h3><code>${p.bindings.join(', ')}</code><p>${p.actions.join('<br>')}</p><h3>交付边界</h3><p>本页采用 v3 俱乐部紫蓝视觉，是可编辑 HTML/CSS 设计源稿，不是已接入后端的小程序代码。示例姓名、赛程和统计均为虚构。</p><a href="${p.source_url}" target="_blank" rel="noopener">查看固定版本源文件 ↗</a>`;
document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.key===view.key));
if(view.state==='readonly')document.querySelectorAll('#screen .btn[data-act="save"]').forEach(x=>x.disabled=true);
window.STUDIO.ready=true;
}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400);}
function dialog(title,text,confirm='确认',action='close',danger=false){$('#overlay').innerHTML=`<div class="overlay-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="eyebrow">${danger?'请谨慎操作':'柏林花园 FC'}</div><h3>${title}</h3><p>${text}</p><div class="button-row">${b('取消','close','outline')}${b(confirm,action,danger?'danger':'primary')}</div></section></div>`;}
let pickerTarget=null,pickerValue='';
function picker(target){pickerTarget=target;let title=target.dataset.title||'选择选项';let opts=(target.dataset.options||'选项一|选项二').split('|');let date=opts[0]==='日期',time=opts[0]==='时间';pickerValue=target.dataset.value||opts[0];let body=date?`<div class="between"><strong>2026 年 11 月</strong>${icon('calendar',18)}</div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:30},(_,i)=>`<button data-act="date-option" data-value="2026-11-${String(i+1).padStart(2,'0')}" class="${i===21?'selected':''}">${i+1}</button>`).join('')}</div>`:time?`<div class="time-pick"><div class="time-column">${['17','18','19','20','21'].map(x=>`<div class="${x==='19'?'selected':''}">${x}</div>`).join('')}</div><div class="time-column">${['20','25','30','35','40'].map(x=>`<div class="${x==='30'?'selected':''}">${x}</div>`).join('')}</div></div><p class="hint">时间样式展示 · 分钟步长 5 分钟</p>`:`<div class="sheet-options">${opts.map(x=>`<button class="sheet-option ${x===pickerValue?'selected':''}" data-act="option" data-value="${ESC(x)}"><span>${ESC(x)}</span><span class="choice-circle">${x===pickerValue?'✓':''}</span></button>`).join('')}</div>`;
$('#overlay').innerHTML=`<div class="overlay-shade sheet-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-handle"></div><h3>${title}</h3><p class="hint">${date?'选择日期后确认':time?'保持已选择的时间':`共 ${opts.length} 项`}</p>${body}<div class="button-row">${b('取消','close','outline')}${b('确定','picker-confirm','primary')}</div></section></div>`;}
function init(){let last='';$('#navigation').innerHTML=SPEC.pages.map(p=>{let group=p.group!==last?`<div class="nav-group">${p.group}</div>`:'';last=p.group;return group+`<button class="nav-item" data-act="go" data-key="${p.key}"><span class="nav-num">${p.id}</span><span>${p.title}</span></button>`;}).join('');
$('#role-select').addEventListener('change',e=>navigate(view.key,{role:e.target.value,state:view.state}));$('#state-select').addEventListener('change',e=>navigate(view.key,{state:e.target.value}));$('#width-select').addEventListener('change',e=>{view.width=Number(e.target.value);navigate(view.key,{state:view.state});});$('#reset-demo').addEventListener('click',()=>{demo.reply='';demo.selected={};demo.search='';navigate('home',{role:'player'});});
document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){demo.search=e.target.value;const subset=people.slice(0,view.state==='inactive'?3:view.state==='unconfirmed'?2:16);const found=subset.filter(p=>(p[0].includes(demo.search)||p[1].includes(demo.search))&&(!demo.selected.position||demo.selected.position==='全部位置'||p[2]===demo.selected.position));$('#players-list').innerHTML=found.length?found.map(person).join(''):empty('没有找到球员','试试调整搜索内容或位置。');}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,v=el.dataset.value;
if(a==='go'){navigate(el.dataset.key,{state:el.dataset.state||'default'});return;}
if(a==='back'){navigate(view.key==='login'?'home':view.key.startsWith('tactic')?'tactics':view.key.startsWith('manage')?'me':view.key==='match-roster'||view.key==='match-media'?'match-detail':'me');return;}
if(a==='state'){navigate(view.key,{state:v});return;}
if(a==='close'){$('#overlay').innerHTML='';return;}
if(a==='select'){picker(el);return;}
if(a==='option'){pickerValue=v;document.querySelectorAll('.sheet-option').forEach(x=>{x.classList.toggle('selected',x.dataset.value===v);x.querySelector('.choice-circle').textContent=x.dataset.value===v?'✓':'';});return;}
if(a==='date-option'){pickerValue=v;document.querySelectorAll('.calendar button').forEach(x=>x.classList.toggle('selected',x.dataset.value===v));return;}
if(a==='picker-confirm'){if(pickerTarget&&typeof pickerTarget.querySelector==='function'){let selected=pickerTarget.dataset.options==='时间'?'19:30':pickerValue;const label=pickerTarget.querySelector('span');if(label)label.textContent=selected;pickerTarget.dataset.value=selected;if(pickerTarget.dataset.selectid)demo.selected[pickerTarget.dataset.selectid]=selected;if(view.key==='players'&&pickerTarget.dataset.selectid==='position'){const subset=people.slice(0,view.state==='inactive'?3:view.state==='unconfirmed'?2:16);const found=subset.filter(p=>(selected==='全部位置'||p[2]===selected)&&(!demo.search||p[0].includes(demo.search)||p[1].includes(demo.search)));$('#players-list').innerHTML=found.length?found.map(person).join(''):empty('没有找到球员','试试调整搜索或位置。');}}$('#overlay').innerHTML='';return;}
if(a==='reply'){demo.reply=v;$('#overlay').innerHTML='';render();toast('演示：已切换报名样式，未发送请求');return;}
if(a==='chip'){el.classList.toggle('active');return;}
if(a==='switch'){el.classList.toggle('off');return;}
if(a==='toggle-password'){navigate('me',{state:view.state==='password'?'default':'password'});return;}
if(a==='login'){navigate('home',{role:view.role});toast('进入虚构数据演示，不是真实登录');return;}
if(a==='logout'){dialog('退出当前账号？','实际退出应撤销会话并清理当前账号资料。此处仅切换到登录设计页。','退出','demo-logout',true);return;}
if(a==='demo-logout'){navigate('login',{role:'player'});return;}
if(a==='save'){dialog('设计演示，不提交数据','本操作只用于检查页面层级与反馈样式。实际保存请继续调用原页面事件与服务端接口。','知道了');return;}
if(a==='danger-confirm'||a==='remove'){dialog(el.textContent.trim()+'？','请明确核对影响范围。真实操作需保留现有确认、权限与并发检查；本原型不会修改任何记录。','确认（仅演示）','close',true);return;}
if(a==='map'){dialog('打开微信地图','实际小程序使用仓库现有定位与地图能力。这里没有真实地图或地理坐标。','知道了');return;}
if(a==='share'){dialog('分享比赛','仅已发布比赛提供分享。真实分享卡片由现有画布生成，设计原型不会发送消息。','知道了');return;}
if(a==='upload'||a==='file'){dialog(a==='file'?'选择战术 JSON':'选择已获授权的图片',a==='file'?'真实导入最多 8 MiB，追加而非覆盖；结果不确定时先核对原任务。':'真实选择交给微信原生界面，取消不会更改已有图片。PNG / JPG，每张最多 2 MB。','知道了');return;}
if(a==='download'){dialog('保存到本机','此处不模拟成功。真实客户端需要处理保存成功、取消和系统不支持三种结果。','知道了');return;}
if(a==='export'){navigate('tactic-export',{state:'ready'});return;}
if(a==='play'){demo.played=!demo.played;el.innerHTML=icon(demo.played?'pause':'play',16)+(demo.played?'暂停':'播放演示');toast('布局演示：原型不计算战术动画');return;}
if(a==='tools'){picker({dataset:{title:'画布工具',options:'选择 / 移动|直线|箭头|矩形|圆形|文字标注',value:'选择 / 移动'}});return;}
if(a==='properties'){dialog('标注属性','颜色、线宽、虚线与文字内容使用现有属性控制。正式开发时展开底部属性面板，勿挤压整个球场。','知道了');return;}
if(a==='piece'){toast('球员棋子示意；真实拖拽保留仓库画布逻辑');return;}
if(a==='create-tactic'){navigate('tactic-board',{state:'editing'});return;}
if(a==='claim'){navigate('wechat-claim',{state:'claimed'});return;}
if(a==='approve'){dialog('核对并批准认领','请通过原有联系渠道核对球员本人及确认编号。不能只凭认领状态直接批准。','已核对（演示）','close');return;}
if(a==='invite-card'){dialog('邀请卡片预览','设计原型不生成可用邀请码或二维码。真实卡片仅交给球员本人，由原有接口生成。','知道了');return;}
if(a==='ai-generate'){navigate('player-ai',{state:'generating'});return;}
if(a==='ai-poll'){navigate('player-ai',{state:'candidate'});return;}
if(a==='adopt'){dialog('将候选设为头像？','实际采用会替换当前头像，相册与出场封面不变。原型只演示确认，不调用生成或采用接口。','确认采用（演示）','close');return;}
if(a==='clear-time'){demo.selected.matchtime='时间待定';render();return;}
toast('设计演示；真实操作请保留对应页面业务事件');});
window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';});render();}
window.STUDIO={ready:false,navigate,render,getView:()=>({...view}),pages:SPEC.pages,variants,icon,showDialog:dialog};init();
})();
</script></body></html>
